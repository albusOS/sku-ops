# docker-compose.yml — optional local stack (Postgres + Redis + backend).
#
# Production uses hosted services (e.g. DigitalOcean App Platform + Supabase + Vercel), not this file.
# ENV defaults to development when not set (override auto-merges for docker-local).
# Valid values: development | production
#
# Usage (from repo root):
#   docker compose up
#   docker-compose.override.yml is auto-merged: exposes db:5433 and backend:8000, defaults ENV=development.
#   Minimum root .env: POSTGRES_PASSWORD, JWT_SECRET, CORS_ORIGINS, ENV
#
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sku_ops
      POSTGRES_USER: sku_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sku_ops"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://sku_ops:${POSTGRES_PASSWORD}@db:5432/sku_ops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-1}
      PG_POOL_MIN: ${PG_POOL_MIN:-2}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_ACQUIRE_TIMEOUT: ${PG_ACQUIRE_TIMEOUT:-10}
      PG_COMMAND_TIMEOUT: ${PG_COMMAND_TIMEOUT:-30}
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
