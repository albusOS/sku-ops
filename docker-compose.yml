# docker-compose.yml - local container smoke check (Redis + backend).
#
# Database is Supabase (local via `supabase start` or hosted). Not managed here.
# Production uses DigitalOcean App Platform + Supabase + Vercel, not this file.
#
# Usage (from repo root):
#   1. Start local Supabase: pixi run supabase start
#   2. Copy .env.example to .env and fill required values
#   3. docker compose up
#
# Minimum .env: DATABASE_URL, JWT_SECRET
#
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-1}
      PG_POOL_MIN: ${PG_POOL_MIN:-2}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_ACQUIRE_TIMEOUT: ${PG_ACQUIRE_TIMEOUT:-10}
      PG_COMMAND_TIMEOUT: ${PG_COMMAND_TIMEOUT:-30}
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

networks:
  internal:
    driver: bridge
