# docker-compose.yml - local container smoke check (Redis + backend).
#
# Database is Supabase (local via `supabase start` or hosted). Not managed here.
# Production uses DigitalOcean App Platform + Supabase + Vercel, not this file.
#
# Usage (from repo root):
#   1. Start local Supabase: pixi run supabase start
#   2. Copy .env.example to .env and fill required values
#   3. docker compose up
#
# Minimum .env: PRIVATE_DATABASE_URL, PRIVATE_JWT_SECRET
#
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      PUBLIC_ENV: ${PUBLIC_ENV:-development}
      PRIVATE_DATABASE_URL: ${PRIVATE_DATABASE_URL:?PRIVATE_DATABASE_URL must be set}
      PUBLIC_REDIS_URL: redis://redis:6379
      PRIVATE_JWT_SECRET: ${PRIVATE_JWT_SECRET:?PRIVATE_JWT_SECRET must be set}
      PUBLIC_CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      PRIVATE_METRICS_TOKEN: ${PRIVATE_METRICS_TOKEN:-}
      PRIVATE_ANTHROPIC_API_KEY: ${PRIVATE_ANTHROPIC_API_KEY:-}
      PRIVATE_OPENROUTER_API_KEY: ${PRIVATE_OPENROUTER_API_KEY:-}
      PRIVATE_OPENAI_API_KEY: ${PRIVATE_OPENAI_API_KEY:-}
      PUBLIC_XERO_CLIENT_ID: ${PUBLIC_XERO_CLIENT_ID:-}
      PRIVATE_XERO_CLIENT_SECRET: ${PRIVATE_XERO_CLIENT_SECRET:-}
      PUBLIC_XERO_REDIRECT_URI: ${PUBLIC_XERO_REDIRECT_URI:-}
      PRIVATE_SENTRY_DSN: ${PRIVATE_SENTRY_DSN:-}
      PUBLIC_LOG_LEVEL: ${PUBLIC_LOG_LEVEL:-INFO}
      PUBLIC_WORKERS: ${PUBLIC_WORKERS:-1}
      PUBLIC_PG_POOL_MIN: ${PUBLIC_PG_POOL_MIN:-2}
      PUBLIC_PG_POOL_MAX: ${PUBLIC_PG_POOL_MAX:-10}
      PUBLIC_PG_ACQUIRE_TIMEOUT: ${PUBLIC_PG_ACQUIRE_TIMEOUT:-10}
      PUBLIC_PG_COMMAND_TIMEOUT: ${PUBLIC_PG_COMMAND_TIMEOUT:-30}
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

networks:
  internal:
    driver: bridge
