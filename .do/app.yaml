# DigitalOcean App Platform spec (template for CI).
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Deploy: GitHub Actions renders this file with envsubst (PRIVATE_* + IMAGE_TAG only),
# then: doctl apps update <app-id> --spec .do/app.rendered.yaml
#
# Non-secrets live in backend/.env.production (baked into the Docker image). This file
# only injects secrets and PUBLIC_REDIS_URL from the Valkey database binding.
#
# GHCR pull auth: registry_credentials is templated from $GHCR_REGISTRY_CREDS
# (username:PAT) on every deploy. Omitting it from a spec update clears saved creds.
# Bootstrap: devtools/scripts/do_apps_create_ghcr.py or set the secret in GitHub.
#
# Valkey: production managed DBaaS — `cluster_name` must be an existing DO Valkey cluster
# (App Platform does not provision production Valkey from spec alone). See databases valkey-cache.

name: sku-ops-backend
region: nyc1

databases:
  - name: valkey-cache
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: sku-ops-backend-valkey

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /

services:
  - name: api
    image:
      registry_type: GHCR
      registry: albusos
      repository: sku-ops-backend
      tag: "$IMAGE_TAG"
      registry_credentials: "$GHCR_REGISTRY_CREDS"
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8000
    health_check:
      http_path: /api/beta/shared/health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: PUBLIC_ENV
        scope: RUN_TIME
        type: GENERAL
        value: "production"
      - key: PRIVATE_DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_DB_PASSWORD"
      - key: PRIVATE_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_JWT_SECRET"
      - key: PRIVATE_SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_SENTRY_DSN"
      - key: PRIVATE_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_ANTHROPIC_API_KEY"
      - key: PRIVATE_OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_OPENROUTER_API_KEY"
      - key: PRIVATE_OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_OPENAI_API_KEY"
      - key: PRIVATE_XERO_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "$PRIVATE_XERO_CLIENT_SECRET"
      - key: PUBLIC_REDIS_URL
        scope: RUN_TIME
        type: GENERAL
        value: "${valkey-cache.DATABASE_URL}"
