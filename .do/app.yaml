# DigitalOcean App Platform spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# The backend image is built by GitHub Actions and pushed to GHCR.
# App Platform pulls the image and deploys it.
#
# Create / update the app:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
#
# GHCR pull auth: if the package is private, App Platform needs
# registry_credentials (see image.registry_credentials in App spec reference).
# From repo root (PAT must include read:packages; gh auth token often lacks it):
#   export GHCR_REGISTRY_CREDS='github_username:ghp_xxx'
#   pixi run uv run --directory backend python devtools/scripts/do_apps_create_ghcr.py
# Or make ghcr.io/<owner>/sku-ops-backend public in GitHub Package settings, then
# plain doctl create works without credentials. DO encrypts credentials on first apply.
#
# Secret env values (DATABASE_URL, JWT_SECRET, etc.): set real values in the DO
# dashboard or doctl after first apply — do not commit secrets.

name: sku-ops-backend
region: nyc1

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /

services:
  - name: api
    image:
      registry_type: GHCR
      # Must match GitHub org/user that owns the GHCR package (lowercase), same as github.repository_owner in deploy.yml.
      registry: albusos
      repository: sku-ops-backend
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8000
    health_check:
      http_path: /api/beta/shared/health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: REPLACE_WITH_VERCEL_DOMAINS
      - key: CORS_ORIGIN_REGEX
        scope: RUN_TIME
        value: ""
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: REPLACE_WITH_VERCEL_URL
      - key: REDIS_URL
        scope: RUN_TIME
        value: ""
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: XERO_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: XERO_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_VIA_DASHBOARD
      - key: XERO_REDIRECT_URI
        scope: RUN_TIME
        value: REPLACE_WITH_CALLBACK_URL
