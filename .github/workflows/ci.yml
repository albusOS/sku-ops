name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/**'
            frontend:
              - 'frontend/**'

  backend-lint:
    name: Backend (lint)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Install backend virtualenv (uv + pixi Python)
        run: pixi run uv sync --dev --directory backend

      - name: Lint
        run: pixi run lint backend

      - name: Format check
        run: pixi run format-check backend

      - name: Audit dependencies
        run: pixi run uv run --directory backend pip-audit

  backend-test:
    name: Backend (test)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install backend virtualenv (uv + pixi Python)
        run: pixi run uv sync --dev --directory backend

      - name: Run tests
        env:
          PUBLIC_ENV: test
          PRIVATE_JWT_SECRET: ci-test-secret
        run: pixi run tests backend

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  frontend-lint:
    name: Frontend (lint)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Install dependencies
        run: pixi run pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: pixi run lint frontend

      - name: Format check
        run: pixi run format-check frontend

      - name: Build
        run: pixi run pnpm --dir frontend run build

  frontend-test:
    name: Frontend (test)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Install dependencies
        run: pixi run pnpm --dir frontend install --frozen-lockfile

      - name: Run tests
        run: pixi run tests frontend
