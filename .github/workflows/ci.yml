name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install backend virtualenv (uv + pixi Python)
        run: pixi run uv sync --dev --directory backend

      - name: Apply migrations and seeds
        run: supabase db reset --local --yes

      - name: Lint
        run: pixi run lint backend

      - name: Format check
        run: pixi run uv run --directory backend ruff format --check .

      - name: Audit dependencies
        run: pixi run uv run --directory backend pip-audit

      - name: Run tests
        env:
          ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          JWT_SECRET: ci-test-secret
          # Leave ANTHROPIC_API_KEY unset - conftest sets it to "" so
          # ANTHROPIC_AVAILABLE=False and no real API calls are made in tests.
        run: pixi run uv run --directory backend pytest --tb=short -q --timeout=60

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Install dependencies
        run: pixi run pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: pixi run pnpm --dir frontend run lint

      - name: Format check
        run: pixi run pnpm --dir frontend run format:check

      - name: Build
        run: pixi run pnpm --dir frontend run build

      - name: Run tests
        run: pixi run pnpm --dir frontend run test:run
