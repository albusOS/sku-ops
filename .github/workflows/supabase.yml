name: Supabase

on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/**"
      - "templates"
      - ".github/workflows/supabase.yml"
      - ".cursor/skills/use-database/scripts/supabase_type_generation/**"
      - "backend/shared/infrastructure/types/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "supabase/**"
      - "templates"
      - ".github/workflows/supabase.yml"
      - ".cursor/skills/use-database/scripts/supabase_type_generation/**"
      - "backend/shared/infrastructure/types/**"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typegen-check:
    name: Check SQLModel generation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install backend virtualenv (uv + pixi Python)
        run: pixi run uv sync --dev --directory backend

      - name: Start local Supabase
        run: supabase start

      - name: Generate types and models
        run: pixi run supabase typegen

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code backend/shared/infrastructure/types/ || {
            echo "::error::Generated types are out of date. Run the typegen pipeline locally and commit the changes."
            echo ""
            echo "To fix:"
            echo "  pixi run supabase start"
            echo "  pixi run supabase typegen"
            echo "  git add backend/shared/infrastructure/types/"
            echo "  git commit -m 'chore: regenerate SQLModel types'"
            exit 1
          }

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  db-test:
    name: SQLModel DB tests
    needs: [typegen-check]
    runs-on: ubuntu-latest

    env:
      PUBLIC_ENV: test
      PRIVATE_JWT_SECRET: ci-test-secret
      # Match pixi.toml [tasks.tests] PYTHONPATH (paths resolve once uv cwd is backend/)
      PYTHONPATH: "../.cursor/skills/use-database/scripts:.:.."
      PRIVATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install backend virtualenv (uv + pixi Python)
        run: pixi run uv sync --dev --directory backend

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database (migrations + seeds)
        run: pixi run supabase reset

      - name: Run SQLModel generation and DB tests
        run: >
          pixi run uv run --directory backend pytest
          tests/unit/test_sqlmodel_generation/
          tests/integration/test_sqlmodel_db/
          -v

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  db-push:
    name: Push migrations to production
    needs: [db-test]
    if: |
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: supabase_deployment

    env:
      # Supabase CLI expects these names; values come from GitHub Environment secrets.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRIVATE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assert GitHub targets production Supabase project
        env:
          EXPECTED_REF: fjzacucejlieklmmhwsm
        run: |
          ACTUAL="${{ secrets.PUBLIC_PROJECT_ID }}"
          if [ -z "$ACTUAL" ]; then
            echo "::error::PUBLIC_PROJECT_ID is empty in Environment supabase_deployment."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_REF" ]; then
            echo "::error::PUBLIC_PROJECT_ID (${ACTUAL}) must equal ${EXPECTED_REF} so migrations and config push hit the same project as backend/.env.production and VITE_SUPABASE_URL."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link, push migrations, and sync remote config
        run: |
          supabase link --project-ref "${{ secrets.PUBLIC_PROJECT_ID }}"
          supabase db push
          # Email templates and most auth keys; hosted site_url often stays stale (CLI reports "up to date" while API still has localhost).
          supabase config push --project-ref "${{ secrets.PUBLIC_PROJECT_ID }}" --yes --workdir supabase

      - name: Force hosted Auth URL config (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ secrets.PUBLIC_PROJECT_ID }}"
          SITE_URL="https://sku-ops-humblhumans.vercel.app"
          # GoTrue URI_ALLOW_LIST / dashboard "Redirect URLs": comma-separated (see supabase/config.toml additional_redirect_urls).
          URLS=(
            "http://127.0.0.1:3000"
            "http://127.0.0.1:3000/auth/callback"
            "http://localhost:3000"
            "http://localhost:3000/auth/callback"
            "https://127.0.0.1:3000"
            "${SITE_URL}"
            "${SITE_URL}/"
            "${SITE_URL}/**"
            "${SITE_URL}/auth/callback"
            "https://sku-*-ops-humblhumans.vercel.app"
            "https://sku-*-ops-humblhumans.vercel.app/**"
            "https://sku-ops-jjfantini-humblhumans.vercel.app"
            "https://sku-ops-jjfantini-humblhumans.vercel.app/"
            "https://sku-ops-jjfantini-humblhumans.vercel.app/**"
            "https://sku-*-ops-jjfantini-humblhumans.vercel.app"
            "https://sku-*-ops-jjfantini-humblhumans.vercel.app/**"
          )
          IFS=,
          URIS="${URLS[*]}"
          unset IFS
          BODY=$(jq -n --arg u "$SITE_URL" --arg uris "$URIS" '{site_url: $u, uri_allow_list: $uris}')
          echo "PATCH /v1/projects/${REF}/config/auth (site_url + uri_allow_list)"
          HTTP=$(curl -sS -o /tmp/auth_patch_body.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${REF}/config/auth" \
            -d "$BODY")
          echo "HTTP ${HTTP}"
          cat /tmp/auth_patch_body.json | head -c 2500
          echo ""
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ] && [ "$HTTP" != "204" ]; then
            echo "::error::Management API PATCH auth failed. Token needs auth_config_write / project_admin_write."
            exit 1
          fi

      - name: Verify hosted Auth URL config (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ secrets.PUBLIC_PROJECT_ID }}"
          JSON=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${REF}/config/auth")
          SITE=$(echo "$JSON" | jq -r '.site_url // empty')
          URIS=$(echo "$JSON" | jq -r '.uri_allow_list // empty')
          echo "Hosted site_url from API: ${SITE}"
          echo "Hosted uri_allow_list (first 400 chars): ${URIS:0:400}"
          if [ -z "${SITE}" ]; then
            echo "::error::Could not read site_url from Management API response."
            echo "$JSON" | head -c 1200
            exit 1
          fi
          case "${SITE}" in
            *127.0.0.1*|*localhost*)
              echo "::error::site_url is still localhost after PATCH."
              exit 1
              ;;
          esac
          if ! echo "$URIS" | grep -q 'sku-ops-humblhumans'; then
            echo "::error::uri_allow_list does not include production Vercel host (check PATCH body / API field names)."
            exit 1
          fi
