name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".do/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Reusable ci.yml needs pull-requests:read (paths-filter). Callers cap child permissions.
permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sku-ops-backend

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend_build: ${{ steps.filter.outputs.backend_build }}
      backend_deploy: ${{ steps.filter.outputs.backend_deploy }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend_build:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            backend_deploy:
              - 'backend/**'
              - '.do/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  ci:
    name: CI gate
    needs: [changes]
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-backend:
    name: Build & push backend image
    needs: [changes, ci]
    if: needs.changes.outputs.backend_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v6

      - name: Image tag (short SHA)
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend (App Platform)
    needs: [changes, ci, build-backend]
    if: |
      needs.changes.outputs.backend_deploy == 'true'
      && needs.ci.result == 'success'
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: backend_digital_ocean_deployment
    env:
      PRIVATE_DB_PASSWORD: ${{ secrets.PRIVATE_DB_PASSWORD }}
      PRIVATE_JWT_SECRET: ${{ secrets.PRIVATE_JWT_SECRET }}
      PRIVATE_SENTRY_DSN: ${{ secrets.PRIVATE_SENTRY_DSN }}
      PRIVATE_ANTHROPIC_API_KEY: ${{ secrets.PRIVATE_ANTHROPIC_API_KEY }}
      PRIVATE_OPENROUTER_API_KEY: ${{ secrets.PRIVATE_OPENROUTER_API_KEY }}
      PRIVATE_OPENAI_API_KEY: ${{ secrets.PRIVATE_OPENAI_API_KEY }}
      PRIVATE_XERO_CLIENT_SECRET: ${{ secrets.PRIVATE_XERO_CLIENT_SECRET }}
      GHCR_REGISTRY_CREDS: ${{ secrets.GHCR_REGISTRY_CREDS }}

    steps:
      - uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve image tag
        id: resolve_tag
        run: |
          if [ "${{ needs.build-backend.result }}" = "success" ] && [ -n "$IMAGE_TAG" ]; then
            echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}

      - name: Render App Platform spec
        env:
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          export IMAGE_TAG
          export PRIVATE_DB_PASSWORD PRIVATE_JWT_SECRET PRIVATE_SENTRY_DSN
          export PRIVATE_ANTHROPIC_API_KEY PRIVATE_OPENROUTER_API_KEY PRIVATE_OPENAI_API_KEY
          export PRIVATE_XERO_CLIENT_SECRET GHCR_REGISTRY_CREDS
          envsubst '$IMAGE_TAG $PRIVATE_DB_PASSWORD $PRIVATE_JWT_SECRET $PRIVATE_SENTRY_DSN $PRIVATE_ANTHROPIC_API_KEY $PRIVATE_OPENROUTER_API_KEY $PRIVATE_OPENAI_API_KEY $PRIVATE_XERO_CLIENT_SECRET $GHCR_REGISTRY_CREDS' \
            < .do/app.yaml > .do/app.rendered.yaml

      - name: Apply spec and deploy
        run: |
          doctl apps update "${{ secrets.DIGITALOCEAN_APP_ID }}" --spec .do/app.rendered.yaml
          doctl apps create-deployment "${{ secrets.DIGITALOCEAN_APP_ID }}" --wait

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [changes, ci]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: frontend_vercel_deployment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Pull Vercel project settings
        run: pixi run npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel CLI / Build Output API)
        run: pixi run npx vercel@50 build --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        run: >
          pixi run npx vercel@50 deploy --prebuilt --prod --yes
          --token="$VERCEL_TOKEN"
          --meta githubCommitSha="${{ github.sha }}"
          --meta githubCommitRef="${{ github.ref_name }}"
          --meta githubRepo="${{ github.repository }}"
          --meta githubActionsRunId="${{ github.run_id }}"
