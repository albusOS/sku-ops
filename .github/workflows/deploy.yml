name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sku-ops-backend

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  ci:
    name: CI gate
    needs: [changes]
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-backend:
    name: Build & push backend image
    needs: [changes, ci]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend (App Platform)
    needs: [build-backend]
    runs-on: ubuntu-latest
    environment: backend_digital_ocean_deployment

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform deploy
        run: |
          doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }} --force-rebuild --wait

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [changes, ci]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: frontend_vercel_deployment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Verify dev tools resolve from pixi
        run: pixi run doctor

      - name: Pull Vercel project settings
        run: pixi run npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel CLI / Build Output API)
        run: pixi run npx vercel@50 build --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        run: >
          pixi run npx vercel@50 deploy --prebuilt --prod --yes
          --token="$VERCEL_TOKEN"
          --meta githubCommitSha="${{ github.sha }}"
          --meta githubCommitRef="${{ github.ref_name }}"
          --meta githubRepo="${{ github.repository }}"
          --meta githubActionsRunId="${{ github.run_id }}"
