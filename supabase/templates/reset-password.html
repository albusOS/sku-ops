<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password - SKU Ops</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#f8fafc;padding:40px 20px">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="max-width:480px;width:100%">
          <tr>
            <td style="padding-bottom:24px">
              <h1 style="margin:0;font-size:22px;font-weight:600;color:#0f172a">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;border-radius:12px;padding:36px 32px">
              <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#334155">
                We received a request to reset your SKU Ops password. Click the button below to choose a new one.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center" style="padding:8px 0 24px">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background-color:#0f172a;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;border-radius:6px;padding:12px 32px;line-height:1.5">
                      Reset Password
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#94a3b8">
                If you didn't request a password reset, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding-top:24px">
              <p style="margin:0;font-size:12px;color:#94a3b8">SKU Ops</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
